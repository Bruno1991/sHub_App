<script>
window.addEventListener('DOMContentLoaded', () => {
    const results = {};
    document.querySelectorAll('svg[data-filename]').forEach(svg => {
        const fname = svg.getAttribute('data-filename');
        const bbox = svg.getBBox();
        results[fname] = { x: bbox.x, y: bbox.y, width: bbox.width, height: bbox.height };
    });
    document.getElementById('results').textContent = JSON.stringify(results);
});
</script></body></html>
