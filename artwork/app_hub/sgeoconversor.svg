<svg xmlns="http://www.w3.org/2000/svg" height="48px" viewBox="0 -960 960 960" width="48px">
  <defs>
    <!-- Gradiente moderno do sFoto para as setas (Indigo -> Azul -> Ciano) -->
    <linearGradient id="conversorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Gradiente Verde -> Amarelo Claro para o texto UTM (Invertido) -->
    <linearGradient id="yellowGreenGradientUtm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>

    <!-- Gradiente Amarelo Claro -> Verde para o texto GEO -->
    <linearGradient id="yellowGreenGradientGeo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <!-- Seta Superior (Apontando para a esquerda) -->
  <path fill="url(#conversorGradient)" d="M643-414 450-607l193-193 42 42-121 121h316v60H564l121 121-42 42Z"/>

  <!-- Seta Inferior (Apontando para a direita) -->
  <path fill="url(#conversorGradient)" d="m317-160-42-42 121-121H80v-60h316L275-504l42-42 193 193-193 193Z"/>

  <!-- Texto UTM (Gradiente Verde -> Amarelo) -->
  <text x="240" y="-620" fill="url(#yellowGreenGradientUtm)" font-family="'Roboto', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="160" text-anchor="middle">UTM</text>

  <!-- Texto GEO (Gradiente Amarelo -> Verde) -->
  <text x="720" y="-210" fill="url(#yellowGreenGradientGeo)" font-family="'Roboto', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="160" text-anchor="middle">GEO</text>
</svg>
